<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel GAMEBOTS XIII</title>
<meta name="robots" content="noindex">
<style>
:root{--azul:#0d47c9;--osc:#071433;--ok:#13795b;--bad:#c62828;--nar:#c77700;--line:#d6deec;--bg:#eef2f9;--muted:#5d6b85}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#141a2e;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{background:var(--osc);color:#cfe0ff;padding:10px 14px 8px;position:sticky;top:0;z-index:5}
.hd{display:flex;align-items:center;gap:10px}
.hd b{font:900 italic 18px Arial,sans-serif;color:#fff;letter-spacing:.02em}
.hd .yo{margin-left:auto;text-align:right;font-size:12px;line-height:1.3}
.hd .yo button{background:none;border:1px solid rgba(255,255,255,.3);color:#cfe0ff;border-radius:6px;padding:3px 8px;font-size:11px;margin-top:2px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button{white-space:nowrap;border:0;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);color:#cfe0ff}
nav button.on{background:#1e7bff;color:#fff}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 2px}.sub{font-size:13px;color:var(--muted);margin:0 0 10px}
input[type=search],input[type=text],input[type=tel],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips button{white-space:nowrap;padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:#333}
.chips button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.cnt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:2px 0 6px}
.cnt b{color:var(--ok)}
h3.cat{margin:14px 2px 6px;font-size:12.5px;letter-spacing:.08em;color:var(--azul);text-transform:uppercase}
.it{display:flex;align-items:center;gap:10px;background:#fff;margin-bottom:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line)}
.it .nm{flex:1;font-size:17px;font-weight:600;word-break:break-word}
.it .nm small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.it.ok{background:#eaf7f1;border-color:#a8dcc4}
.cp{font-size:12px;border:1px solid var(--line);background:#f6f8fc;border-radius:6px;padding:7px 9px;color:#333}
.ck{width:34px;height:34px;border-radius:8px;border:2px solid #9aa7bd;background:#fff;display:grid;place-items:center;font-size:20px;color:#fff;flex:none;padding:0}
.it.ok .ck{background:var(--ok);border-color:var(--ok)}
.res{display:flex;gap:8px;margin:8px 0}
.res div{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px;font-size:11px;color:#555}
.res b{display:block;font-size:20px}
.g{color:var(--ok)}.r{color:var(--bad)}.p{color:#888}
.card{background:#fff;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);padding:11px 12px}
.card .h{display:flex;align-items:center;gap:8px;cursor:pointer}
.card .eq{flex:1;font-weight:700;font-size:16px;word-break:break-word}
.card .eq small{display:block;color:#666;font-size:12px;font-weight:400;margin-top:2px}
.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;white-space:nowrap}
.tag.APROBADO{background:#e3f4ed;color:var(--ok)}.tag.NO{background:#fdecea;color:var(--bad)}.tag.PENDIENTE{background:#eef0f4;color:#666}
.card.APROBADO{border-left:5px solid var(--ok)}.card.NO{border-left:5px solid var(--bad)}.card.open{border:2px solid var(--azul)}
.obs{font-size:12.5px;color:var(--bad);margin-top:6px}
.chk{margin:10px 0 6px;display:grid;gap:4px}
.chk label{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:5px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.bt{display:flex;gap:8px;margin-top:8px}
.bt button{flex:1;padding:12px;border-radius:8px;font-weight:800;color:#fff;font-size:15px;border:0}
.a{background:var(--ok)}.n{background:var(--bad)}.w{background:var(--nar)}.b{background:var(--azul)}.gr{background:#eef0f4!important;color:#333!important}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.box h2{margin:0 0 8px;font-size:16px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#555}
.kpi b{display:block;font-size:24px;color:#141a2e}.kpi b.g{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#555;font-size:12px;padding:7px 6px;border-bottom:2px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid #edf0f6;vertical-align:middle}
.bar{height:8px;border-radius:9px;background:#e7ecf5;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:10px;font-size:13px;font-weight:700;color:#555;background:none;border:0}
.seg button.on{background:var(--azul);color:#fff}
.mini{font-size:12px;padding:7px 10px;border-radius:7px;border:1px solid #e0a100;color:#8a5a00;background:#fff8e6;font-weight:700}
.log{border-left:5px solid var(--azul)}
.pin{font-family:Consolas,monospace;background:#f3f6fb;padding:3px 7px;border-radius:5px}
.rol{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#e7f0ff;color:var(--azul)}
.rol.ACR{background:#fff4d6;color:#8a5a00}.rol.ADM{background:#f1e7ff;color:#5b2ab0}
.off{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(7,20,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.dlg{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.dlg{border-radius:16px}}
.dlg h3{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 10px;font-size:14px;color:#444}
.opt{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.opt input{width:20px;height:20px}
.opt small{display:block;color:#666;font-size:12px}
.fl{display:grid;gap:4px;margin-bottom:10px;font-size:13px;font-weight:600;color:#444}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-weight:500}
.cats label{display:flex;gap:6px;align-items:center;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#141a2e;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.err{background:var(--bad)}
.login{max-width:380px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;text-align:center}
.login h1{font:900 italic 24px Arial,sans-serif;color:var(--osc)}
.login input{text-align:center;font-size:26px;letter-spacing:.3em;margin:14px 0 10px}
.login button{width:100%;padding:13px;border:0;border-radius:9px;background:var(--azul);color:#fff;font-weight:800;font-size:16px}
.vacio{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.cargando{opacity:.6;pointer-events:none}
@media(max-width:700px){.kpi{grid-template-columns:1fr 1fr}.bar{width:50px}.hidem{display:none}}
</style></head>
<body>
<div id="vLogin" class="login">
  <h1>GAMEBOTS XIII</h1>
  <div class="sub">Panel del torneo · ingresa tu PIN</div>
  <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••••">
  <button id="entrar">Entrar</button>
  <div id="lerr" class="obs"></div>
</div>

<div id="app" hidden>
<header>
  <div class="hd"><b>GAMEBOTS XIII</b><div class="yo"><span id="yoRol"></span><br><span id="yoNom"></span> <button id="salir">Salir</button></div></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- conexión con Apps Script ---------- */
const API_URL = "https://script.google.com/macros/s/AKfycbwvOiH9eWc9SkfuFnRsoKiy3OIeZsTwE9Ck44jONRkVk5xaNXQ8uFivAa8JBWkPw9X8QQ/exec";
function api(fn, ...args) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
    .then(r => r.text())
    .then(t => { let j; try { j = JSON.parse(t); } catch (e) { throw new Error('El servidor respondió algo inesperado. Revisa que el panel esté instalado.'); }
      if (!j.ok) throw new Error(j.error || 'Error del servidor.'); return j.data; },
      e => { if (e && e.message && e.message.indexOf('servidor') >= 0) throw e; throw new Error('Sin conexión con el servidor. Revisa tu internet.'); });
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, err ? 5000 : 2200); }

let PIN = '', D = null, VISTA = '', F = { q: '', cat: '' }, ABIERTO = '', SEG = 'acred';

/* ---------- ingreso ---------- */
function entrar(pin) {
  $('entrar').disabled = true; $('lerr').textContent = '';
  api('pDatos', pin).then(d => { PIN = pin; ss.set('gx_pin', pin); D = d; iniciar(); })
    .catch(e => { $('lerr').textContent = e.message; ss.del('gx_pin'); $('vLogin').hidden = false; })
    .finally(() => $('entrar').disabled = false);
}
$('entrar').onclick = () => { const p = $('pin').value.trim(); if (p) entrar(p); };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('entrar').click(); };
$('salir').onclick = () => { ss.del('gx_pin'); location.reload(); };

function iniciar() {
  $('vLogin').hidden = true; $('app').hidden = false;
  $('yoNom').textContent = D.yo.nombre;
  $('yoRol').textContent = { ADMINISTRADOR: 'Administrador', 'ACREDITACIÓN': 'Acreditación', JUEZ: 'Juez · Homologación' }[D.yo.rol] || D.yo.rol;
  const vistas = D.yo.admin ? [['resumen', '📊 Resumen'], ['acred', '🪪 Acreditación'], ['homol', '🔧 Homologación'], ['correc', '✏️ Correcciones'], ['usuarios', '👥 Usuarios y PIN'], ['cert', '📜 Certificados']]
    : D.yo.rol === 'JUEZ' ? [['homol', '🔧 Homologación']] : [['acred', '🪪 Acreditación']];
  $('nav').innerHTML = vistas.length > 1 ? vistas.map(v => `<button data-v="${v[0]}">${v[1]}</button>`).join('') : '';
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => ir(b.dataset.v));
  ir(ss.get('gx_vista') && vistas.some(v => v[0] === ss.get('gx_vista')) ? ss.get('gx_vista') : vistas[0][0]);
  setInterval(() => { if (!document.hidden && !document.querySelector('.ov') && !ABIERTO) recargar(); }, 30000);
}
function ir(v) { VISTA = v; ss.set('gx_vista', v); F = { q: '', cat: '' }; ABIERTO = '';
  $('nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); pintar(); window.scrollTo(0, 0); }
function recargar() { return api('pDatos', PIN).then(d => { D = d; pintar(true); }).catch(e => { if (/PIN/.test(e.message)) { ss.del('gx_pin'); location.reload(); } }); }
function pintar(suave) {
  const y = window.scrollY, foco = document.activeElement && document.activeElement.id;
  ({ resumen: vResumen, acred: vAcred, homol: vHomol, correc: vCorrec, usuarios: vUsuarios, cert: vCert })[VISTA]();
  if (suave) { window.scrollTo(0, y); if (foco && $(foco)) { const el = $(foco); el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } }
}
const catNom = c => { const x = D.categorias.find(k => k.cod === c); return x ? x.nombre : c; };
function chips(cats, todasTxt) {
  return `<div class="chips">${todasTxt ? `<button data-c="" class="${F.cat ? '' : 'on'}">${todasTxt}</button>` : ''}${cats.map(c => `<button data-c="${c.cod}" class="${F.cat === c.cod ? 'on' : ''}">${c.cod} ${esc(c.nombre)}</button>`).join('')}</div>`;
}
function enlazarFiltros(fn) {
  const q = $('q'); if (q) q.oninput = () => { F.q = q.value; fn(); };
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { F.cat = b.dataset.c; pintar(); });
}

/* ---------- ACREDITACIÓN ---------- */
function vAcred() {
  const m = $('main');
  const personas = [];
  D.equipos.forEach(e => e.p.forEach(p => personas.push({ e, p })));
  const tot = personas.length, ok = personas.filter(x => x.p.acred).length;
  m.innerHTML = `<h1>Acreditación</h1><p class="sub">Solo concursantes. Toca el cuadro cuando la persona esté acreditada.</p>
    <input id="q" type="search" placeholder="🔎 Buscar nombre…" value="${esc(F.q)}">
    <div class="cnt"><span>Acreditados: <b>${ok}</b> de ${tot}</span><span class="hidem">Copia el nombre para el gafete</span></div>
    ${chips(D.categorias, 'Todas')}<div id="lista"></div>`;
  const lista = () => {
    const q = norm(F.q);
    let h = '';
    D.categorias.filter(c => !F.cat || c.cod === F.cat).forEach(c => {
      const ps = personas.filter(x => x.e.cat === c.cod && (!q || norm(x.p.nombre + ' ' + x.e.equipo).indexOf(q) >= 0));
      if (!ps.length) return;
      h += `<h3 class="cat">${c.cod} · ${esc(c.nombre)}</h3>` + ps.map(x => `<div class="it ${x.p.acred ? 'ok' : ''}">
        <span class="nm">${esc(x.p.nombre)}<small>${x.p.acred ? '✓ acreditado' + (x.p.hora ? ' · ' + esc(x.p.hora) : '') : esc(x.e.equipo)}</small></span>
        <button class="cp" data-copia="${esc(x.p.nombre)}">Copiar</button>
        <button class="ck" data-cod="${x.e.codigo}" data-n="${x.p.n}" ${x.p.acred ? 'aria-checked="true"' : ''}>${x.p.acred ? '✓' : ''}</button></div>`).join('');
    });
    $('lista').innerHTML = h || '<div class="vacio">No hay concursantes con ese nombre.</div>';
    $('lista').querySelectorAll('[data-copia]').forEach(b => b.onclick = () => copiar(b.dataset.copia));
    $('lista').querySelectorAll('.ck').forEach(b => b.onclick = () => acreditar(b));
  };
  lista(); enlazarFiltros(lista);
}
function copiar(t) {
  const ok = () => toast('Copiado: ' + t);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, () => viejo());
  else viejo();
  function viejo() { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('No se pudo copiar', true); } a.remove(); }
}
function acreditar(b) {
  const e = D.equipos.find(x => x.codigo === b.dataset.cod), p = e.p[b.dataset.n - 1];
  if (p.acred) { toast(D.yo.admin ? 'Para quitarla usa Correcciones.' : 'Ya está acreditado. Si fue un error, avisa al administrador.'); return; }
  const fila = b.closest('.it'); fila.classList.add('ok', 'cargando'); b.textContent = '✓';
  api('pAcreditar', PIN, e.codigo, p.n).then(r => { p.acred = true; p.hora = r.hora; toast('Acreditado: ' + p.nombre); pintar(true); })
    .catch(er => { fila.classList.remove('ok'); b.textContent = ''; toast(er.message, true); })
    .finally(() => fila.classList.remove('cargando'));
}

/* ---------- HOMOLOGACIÓN ---------- */
function vHomol() {
  const m = $('main');
  if (!F.cat && D.categorias.length) F.cat = D.categorias[0].cod;
  const eq = D.equipos.filter(e => e.cat === F.cat);
  const c = { A: 0, N: 0, P: 0 }; eq.forEach(e => { const s = e.homol.estado; c[s === 'APROBADO' ? 'A' : s === 'NO APROBADO' ? 'N' : 'P']++; });
  m.innerHTML = `<h1>Homologación</h1>${chips(D.categorias)}
    <input id="q" type="search" placeholder="🔎 Buscar equipo, robot o participante…" value="${esc(F.q)}">
    <div class="res"><div><b class="g">${c.A}</b>Aprobados</div><div><b class="r">${c.N}</b>No aprobados</div><div><b class="p">${c.P}</b>Pendientes</div></div><div id="lista"></div>`;
  const lista = () => {
    const q = norm(F.q), cat = D.categorias.find(k => k.cod === F.cat) || { checks: [] };
    const xs = eq.filter(e => !q || norm(e.equipo + ' ' + e.robot + ' ' + e.p.map(p => p.nombre).join(' ') + ' ' + e.inst).indexOf(q) >= 0);
    $('lista').innerHTML = xs.map(e => {
      const s = e.homol.estado, k = s === 'NO APROBADO' ? 'NO' : s, ab = ABIERTO === e.codigo;
      const puede = s !== 'APROBADO' || D.yo.admin;
      return `<div class="card ${k} ${ab ? 'open' : ''}" data-cod="${e.codigo}"><div class="h"><span class="eq">${esc(e.equipo)} · “${esc(e.robot)}”<small>${esc(e.inst)}${e.homol.juez ? ' · ' + esc(e.homol.juez) + ' ' + esc(e.homol.hora || '') : ''}</small></span><span class="tag ${k}">${s}</span></div>
        ${s === 'NO APROBADO' && e.homol.nocumple ? `<div class="obs">No cumple: ${esc(e.homol.nocumple)}</div>` : ''}
        ${ab && puede && s !== 'APROBADO' ? `<div class="chk">${cat.checks.map((t, i) => `<label><input type="checkbox" data-i="${i}">${esc(t)}</label>`).join('')}</div>
          <div class="bt"><button class="a" data-ap="1">✓ APROBAR</button><button class="n" data-ap="0">✕ NO APROBAR</button></div>` : ''}
        ${ab && s === 'APROBADO' ? `<div class="obs" style="color:#555">Ya aprobado. ${D.yo.admin ? 'Para cambiarlo usa Correcciones.' : 'Si fue un error, avisa al administrador.'}</div>` : ''}</div>`;
    }).join('') || '<div class="vacio">No hay equipos en esta categoría.</div>';
    $('lista').querySelectorAll('.card .h').forEach(h => h.onclick = () => { const cod = h.parentNode.dataset.cod; ABIERTO = ABIERTO === cod ? '' : cod; lista(); });
    $('lista').querySelectorAll('[data-ap]').forEach(b => b.onclick = () => homologar(b, cat));
  };
  lista(); enlazarFiltros(lista);
}
function homologar(b, cat) {
  const card = b.closest('.card'), cod = card.dataset.cod, ap = b.dataset.ap === '1';
  const marcados = [...card.querySelectorAll('.chk input')].filter(i => i.checked).map(i => cat.checks[i.dataset.i]);
  const falta = cat.checks.filter(t => marcados.indexOf(t) < 0);
  if (ap && falta.length) { toast('Para aprobar marca todos los puntos.', true); return; }
  if (!ap && !falta.length) { toast('Desmarca el punto que no cumple.', true); return; }
  card.classList.add('cargando');
  api('pHomologar', PIN, cod, marcados, ap).then(r => {
    const e = D.equipos.find(x => x.codigo === cod); e.homol = { estado: r.estado, nocumple: r.nocumple, juez: r.juez, hora: '' };
    ABIERTO = ''; toast(r.estado + ': ' + e.equipo); recargar();
  }).catch(er => { card.classList.remove('cargando'); toast(er.message, true); });
}

/* ---------- RESUMEN (admin) ---------- */
function vResumen() {
  const per = D.equipos.reduce((a, e) => a + e.p.length, 0), acr = D.equipos.reduce((a, e) => a + e.p.filter(p => p.acred).length, 0);
  const hom = D.equipos.filter(e => e.homol.estado === 'APROBADO').length;
  $('main').innerHTML = `<h1>Resumen del torneo</h1><p class="sub">Se actualiza solo cada 30 segundos.</p>
   <div class="kpi"><div><b>${D.equipos.length}</b>Equipos inscritos</div><div><b>${per}</b>Concursantes</div><div><b class="g">${acr}</b>Acreditados</div><div><b style="color:var(--azul)">${hom}</b>Robots aprobados</div></div>
   <div class="box"><h2>Avance por categoría</h2><table><tr><th>Categoría</th><th>Equipos</th><th>Acreditación</th><th>Homologación</th></tr>
   ${D.categorias.map(c => { const eq = D.equipos.filter(e => e.cat === c.cod), pp = eq.reduce((a, e) => a + e.p.length, 0), pa = eq.reduce((a, e) => a + e.p.filter(p => p.acred).length, 0);
      const ha = eq.filter(e => e.homol.estado === 'APROBADO').length, hn = eq.filter(e => e.homol.estado === 'NO APROBADO').length;
      return `<tr><td><b>${c.cod}</b> ${esc(c.nombre)}</td><td>${eq.length}</td><td><span class="bar"><i style="width:${pp ? Math.round(pa * 100 / pp) : 0}%"></i></span>${pa}/${pp}</td><td>${ha}/${eq.length}${hn ? ` <span class="r">(${hn} ✕)</span>` : ''}</td></tr>`; }).join('')}
   </table></div>`;
}

/* ---------- CORRECCIONES (admin) ---------- */
function vCorrec() {
  const m = $('main');
  m.innerHTML = `<h1>Correcciones</h1><p class="sub">Solo tú puedes cambiar lo que marcaron los demás. Todo queda en el historial.</p>
   <div class="seg"><button data-s="acred">Acreditación</button><button data-s="homol">Homologación</button><button data-s="hist">Historial</button></div>
   <div id="cz"></div>`;
  m.querySelectorAll('.seg button').forEach(b => { b.classList.toggle('on', b.dataset.s === SEG); b.onclick = () => { SEG = b.dataset.s; F.q = ''; vCorrec(); }; });
  const cz = $('cz');
  if (SEG === 'hist') {
    cz.innerHTML = '<div class="vacio">Cargando…</div>';
    api('pHistorial', PIN).then(h => {
      const col = a => /Corrigió|Quitó/.test(a) ? 'var(--nar)' : /NO APROBADO/.test(a) ? 'var(--bad)' : /APROBADO/.test(a) ? 'var(--ok)' : 'var(--azul)';
      cz.innerHTML = h.length ? h.map(x => `<div class="card log" style="border-left-color:${col(x.accion)}"><div style="font-size:12px;color:#666">${esc(x.fecha)} · ${esc(x.usuario)}</div>
        <div style="font-weight:700;font-size:14px;margin-top:3px">${esc(x.accion)}: ${esc(x.detalle)}</div>${x.motivo ? `<div style="font-size:12.5px;color:#555;margin-top:3px">Motivo: ${esc(x.motivo)}</div>` : ''}</div>`).join('')
        : '<div class="vacio">Todavía no hay movimientos.</div>';
    }).catch(e => cz.innerHTML = `<div class="vacio">${esc(e.message)}</div>`);
    return;
  }
  cz.innerHTML = `<input id="q" type="search" placeholder="🔎 Buscar…" value="${esc(F.q)}"><div id="lista" style="margin-top:10px"></div>`;
  const lista = () => {
    const q = norm(F.q);
    let h = '';
    if (SEG === 'acred') {
      D.equipos.forEach(e => e.p.filter(p => p.acred && (!q || norm(p.nombre + ' ' + e.equipo).indexOf(q) >= 0)).forEach(p => {
        h += `<div class="it ok"><span class="nm">${esc(p.nombre)}<small>${e.cat} · ${esc(e.equipo)} · por ${esc(p.por)} ${esc(p.hora)}</small></span><button class="mini" data-qa="${e.codigo}|${p.n}">↺ Quitar</button></div>`;
      }));
      $('lista').innerHTML = h || '<div class="vacio">No hay acreditados' + (q ? ' con ese nombre' : '') + '.</div>';
      $('lista').querySelectorAll('[data-qa]').forEach(b => b.onclick = () => { const [c, n] = b.dataset.qa.split('|'); dlgAcred(c, +n); });
    } else {
      D.equipos.filter(e => !q || norm(e.equipo + ' ' + e.robot + ' ' + e.codigo).indexOf(q) >= 0).forEach(e => {
        const s = e.homol.estado, k = s === 'NO APROBADO' ? 'NO' : s;
        h += `<div class="card ${k}"><div class="h"><span class="eq">${esc(e.equipo)} · “${esc(e.robot)}”<small>${e.cat} ${esc(catNom(e.cat))}${e.homol.juez ? ' · ' + esc(e.homol.juez) + ' ' + esc(e.homol.hora || '') : ''}</small></span><span class="tag ${k}">${s}</span></div>
          <div class="bt"><button class="w" style="font-size:13px;padding:9px" data-qh="${e.codigo}">↺ Cambiar estado</button></div></div>`;
      });
      $('lista').innerHTML = h || '<div class="vacio">No hay equipos.</div>';
      $('lista').querySelectorAll('[data-qh]').forEach(b => b.onclick = () => dlgHomol(b.dataset.qh));
    }
  };
  lista(); enlazarFiltros(lista);
}
function dialogo(html, onOk) {
  const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="dlg">${html}<textarea id="motivo" rows="2" placeholder="Motivo (obligatorio)" style="margin:6px 0 12px"></textarea>
    <div class="bt"><button class="gr" id="dCan">Cancelar</button><button class="w" id="dOk">Confirmar</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#dCan').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector('#dOk').onclick = () => {
    const mo = ov.querySelector('#motivo').value.trim(); if (!mo) { toast('Escribe el motivo.', true); return; }
    const b = ov.querySelector('#dOk'); b.disabled = true; b.textContent = 'Guardando…';
    onOk(mo, ov).then(() => { ov.remove(); recargar(); }).catch(e => { toast(e.message, true); b.disabled = false; b.textContent = 'Confirmar'; });
  };
}
function dlgAcred(cod, n) {
  const e = D.equipos.find(x => x.codigo === cod), p = e.p[n - 1];
  dialogo(`<h3>Quitar acreditación</h3><p><b>${esc(p.nombre)}</b> (${e.cat} · ${esc(e.equipo)}) fue acreditado por ${esc(p.por)}. Volverá a quedar sin acreditar.</p>`,
    mo => api('pCorregirAcred', PIN, cod, n, mo).then(() => toast('Acreditación quitada')));
}
function dlgHomol(cod) {
  const e = D.equipos.find(x => x.codigo === cod), s = e.homol.estado;
  const ops = [['PENDIENTE', 'Volver a pendiente', 'El juez tendrá que revisarlo otra vez'], ['NO APROBADO', 'Cambiar a NO APROBADO', 'No podrá competir'], ['APROBADO', 'Cambiar a APROBADO', 'Podrá competir']].filter(o => o[0] !== s);
  dialogo(`<h3>Cambiar homologación</h3><p><b>${esc(e.equipo)} · “${esc(e.robot)}”</b> (${e.cat}) está <b>${s}</b>. ¿Qué hacemos?</p>
    ${ops.map((o, i) => `<label class="opt"><input type="radio" name="nv" value="${o[0]}" ${i ? '' : 'checked'}><div><b>${o[1]}</b><small>${o[2]}</small></div></label>`).join('')}`,
    (mo, ov) => api('pCorregirHomol', PIN, cod, ov.querySelector('input[name=nv]:checked').value, mo).then(() => toast('Homologación corregida')));
}

/* ---------- USUARIOS (admin) ---------- */
function vUsuarios() {
  const rc = r => r === 'ADMINISTRADOR' ? 'ADM' : r === 'ACREDITACIÓN' ? 'ACR' : '';
  $('main').innerHTML = `<h1>Usuarios y PIN</h1><p class="sub">Toca una persona para cambiar su PIN, rol o categorías. Desactívala para quitarle el acceso.</p>
   <div class="box"><div style="display:flex;align-items:center;margin-bottom:6px"><h2 style="margin:0">Usuarios</h2><button class="b" id="nuevo" style="margin-left:auto;border:0;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700">+ Nuevo usuario</button></div>
   <table><tr><th>Nombre</th><th>PIN</th><th>Rol</th><th>Categorías</th></tr>
   ${D.usuarios.map(u => `<tr class="${u.activo ? '' : 'off'}" data-f="${u.fila}" style="cursor:pointer"><td>${esc(u.nombre)}${u.activo ? '' : ' <small>(desactivado)</small>'}</td><td><span class="pin">${esc(u.pin)}</span></td><td><span class="rol ${rc(u.rol)}">${esc(u.rol)}</span></td><td>${esc(u.cats)}</td></tr>`).join('')}
   </table></div>`;
  $('nuevo').onclick = () => dlgUsuario(null);
  document.querySelectorAll('tr[data-f]').forEach(t => t.onclick = () => dlgUsuario(D.usuarios.find(u => u.fila == t.dataset.f)));
}
function dlgUsuario(u) {
  const CATS = D.categorias, sel = u ? u.cats.split(/[,\s]+/) : [];
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="dlg"><h3>${u ? 'Modificar usuario' : 'Nuevo usuario'}</h3>
    <label class="fl">Nombre<input id="uN" type="text" value="${esc(u ? u.nombre : '')}" placeholder="Ej.: Ing. Nacho"></label>
    <label class="fl">Rol<select id="uR">${['JUEZ', 'ACREDITACIÓN', 'ADMINISTRADOR'].map(r => `<option ${u && u.rol === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
    <div class="fl" id="uCw">Categorías del juez<div class="cats">${CATS.map(c => `<label><input type="checkbox" value="${c.cod}" ${sel.indexOf(c.cod) >= 0 ? 'checked' : ''}>${c.cod} ${esc(c.nombre)}</label>`).join('')}</div></div>
    <label class="fl">PIN (vacío = se genera solo)<input id="uP" type="tel" inputmode="numeric" maxlength="8" value="${esc(u ? u.pin : '')}"></label>
    ${u ? `<label class="opt"><input type="checkbox" id="uA" ${u.activo ? 'checked' : ''}><div><b>Activo</b><small>Desmárcalo para quitarle el acceso</small></div></label>` : ''}
    <div class="bt"><button class="gr" id="uC">Cancelar</button><button class="b" id="uG">Guardar</button></div></div>`;
  document.body.appendChild(ov);
  const vis = () => ov.querySelector('#uCw').hidden = ov.querySelector('#uR').value !== 'JUEZ'; vis(); ov.querySelector('#uR').onchange = vis;
  ov.querySelector('#uC').onclick = () => ov.remove();
  ov.querySelector('#uG').onclick = () => {
    const b = ov.querySelector('#uG'); b.disabled = true;
    const d = { fila: u ? u.fila : '', nombre: ov.querySelector('#uN').value, rol: ov.querySelector('#uR').value, pin: ov.querySelector('#uP').value,
      cats: [...ov.querySelectorAll('#uCw input:checked')].map(i => i.value).join(','), activo: u ? ov.querySelector('#uA').checked : true };
    api('pGuardarUsuario', PIN, d).then(r => { ov.remove(); toast('Guardado · PIN ' + r.pin); recargar(); }).catch(e => { toast(e.message, true); b.disabled = false; });
  };
}

    <div class="fl" style="margin-top:12px">Por categoría<select id="cCat"><option value="">— elige —</option>${D.categorias.map(c => { const n = l.filter(x => x.cat === c.cod).length; return `<option value="${c.cod}" ${n ? '' : 'disabled'}>${c.cod} ${esc(c.nombre)} (${n})</option>`; }).join('')}</select></div>
    <div class="fl">Un participante<input id="q" type="search" placeholder="🔎 Escribe el nombre…"></div><div id="lista"></div>`;
  $('cTodo').onclick = () => generar(l, 'Certificados_GAMEBOTS_XIII_todos');

  $('q').oninput = () => { const q = norm($('q').value);
    $('lista').innerHTML = q.length < 2 ? '' : l.filter(x => norm(x.nombre).indexOf(q) >= 0).slice(0, 15).map((x, i) => `<div class="it"><span class="nm">${esc(x.nombre)}<small>${x.cat} · ${esc(x.equipo)}</small></span><button class="cp" data-i="${l.indexOf(x)}">⬇ PDF</button></div>`).join('');
    $('lista').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const x = l[b.dataset.i]; generar([x], 'Certificado_' + x.nombre.replace(/\s+/g, '_')); }); };
}

function generar(lista, nombreArchivo) {
  if (!lista.length) return;
  if (!window.jspdf) { toast('No cargó el generador de PDF. Revisa tu internet.', true); return; }
  toast('Generando ' + lista.length + ' certificado(s)…');
  setTimeout(() => {
    const { jsPDF } = window.jspdf;
    const W = 1536, H = 1024, k = 850.39 / W;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [W * k, H * k], compress: true });
    doc.addFileToVFS('GV.ttf', FUENTES.GreatVibes); doc.addFont('GV.ttf', 'GV', 'normal');
    doc.addFileToVFS('MR.ttf', FUENTES.MontR); doc.addFont('MR.ttf', 'M', 'normal');
    doc.addFileToVFS('MB.ttf', FUENTES.MontB); doc.addFont('MB.ttf', 'M', 'bold');
    doc.addFileToVFS('MI.ttf', FUENTES.MontI); doc.addFont('MI.ttf', 'MI', 'normal');
    lista.forEach((x, i) => {
      if (i) doc.addPage([W * k, H * k], 'landscape');
      doc.addImage(FONDO_P, 'JPEG', 0, 0, W * k, H * k, 'fondoP', 'FAST');
      // nombre
      let fs = 96; doc.setFont('GV', 'normal');
      while (fs > 40 && doc.setFontSize(fs * k).getTextWidth(x.nombre) > 800 * k) fs -= 2;
      doc.setTextColor(12, 33, 84); doc.text(x.nombre, 960 * k, 500 * k, { align: 'center' });
      // cinta
      doc.setFont('MI', 'normal'); doc.setFontSize(52 * k); doc.setTextColor(12, 33, 84);
      doc.text('PARTICIPACIÓN', 990 * k, 607 * k, { align: 'center' });
      // texto
      const segs = [['Por su participación en la categoría', 0], [x.cat + ' · ' + x.catNombre + (x.nivel ? ' (' + x.nivel + ')' : '') + ',', 1], ['con el robot', 0], ['“' + x.robot + '”', 1], ['del equipo', 0], ['“' + x.equipo + '”,', 1],
        ['en el Torneo Internacional de Robótica', 0], ['“GAMEBOTS XIII”,', 1], ['organizado por la Carrera de Ingeniería Electrónica de la Universidad Pública de El Alto.', 0]];
      parrafo(doc, segs, 975 * k, 678 * k, 930 * k, 31 * k, 23 * k);
      doc.setFont('M', 'bold'); doc.setFontSize(18 * k); doc.setTextColor(255, 255, 255);

  pal.forEach(([t, b]) => { const ww = w(t, b); if (cur.length && cw + sp + ww > maxw) { lineas.push([cur, cw]); cur = []; cw = 0; } cw += (cur.length ? sp : 0) + ww; cur.push([t, b, ww]); });
  if (cur.length) lineas.push([cur, cw]);
  lineas.forEach(([ln, lw]) => { let x = cx - lw / 2; ln.forEach(([t, b, ww], i) => { if (i) x += sp; doc.setFont('M', b ? 'bold' : 'normal'); doc.setTextColor(...(b ? [20, 60, 160] : [25, 25, 35])); doc.text(t, x, y); x += ww; }); y += lh; });
}
